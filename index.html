<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fdeef2">
<style>body { margin: 0; } [hidden] { display: none !important; }</style>
<title>For Praebooboo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Sniglet:wght@400;800&display=swap">
<style>
  /* One deliberate look: soft blush pink, same on light or dark phones. */
  :root {
    --ground: #fdeef2;
    --ground-2: #fbdde6;
    --petal: #f7b9cb;
    --rose: #e0618c;
    --rose-deep: #c2456f;
    --plum: #4b2334;
    --plum-soft: #8a5a6c;
    --white: #fffafb;
    --ribbon: #fff4f7;
    color-scheme: light;
  }

  html, body { height: 100%; }
  body {
    background:
      radial-gradient(120% 70% at 50% 0%, var(--ground) 0%, var(--ground-2) 100%) fixed,
      var(--ground);
    color: var(--plum);
    font-family: "Fredoka", "Avenir Next", system-ui, sans-serif;
    font-size: 17px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  .screen {
    position: fixed;
    inset: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity .5s ease, transform .5s ease;
  }
  .screen.away { opacity: 0; transform: scale(.96); pointer-events: none; }

  /* ---------- page 1: greeting ---------- */
  .greet { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 32px; }
  .greet h1 {
    font-family: "Sniglet", "Fredoka", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(2.3rem, 10vw, 3.2rem);
    line-height: 1.05;
    color: var(--rose-deep);
    text-wrap: balance;
    margin: 0;
  }
  .greet h1 span {
    display: block;
    margin-top: 10px;
    font-family: "Fredoka", system-ui, sans-serif;
    font-weight: 500;
    font-size: clamp(1.2rem, 5vw, 1.45rem);
    color: var(--plum);
  }
  .choices { display: grid; gap: 12px; }
  .choice {
    font: 500 1.12rem/1.2 "Fredoka", system-ui, sans-serif;
    color: var(--plum);
    background: var(--white);
    border: 2px solid var(--petal);
    border-radius: 20px;
    min-height: 62px;
    padding: 14px 20px;
    text-align: left;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--petal);
    transition: transform .12s ease, box-shadow .12s ease, background .2s;
    animation: rise .6s ease backwards;
  }
  .choice:nth-child(2) { animation-delay: .08s; }
  .choice:nth-child(3) { animation-delay: .16s; }
  .choice:nth-child(4) { animation-delay: .24s; }
  .choice:active, .choice.picked { transform: translateY(4px); box-shadow: 0 0 0 var(--petal); background: var(--ground-2); }
  .choice:focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

  /* ---------- page 2: the gift ---------- */
  #gift { cursor: pointer; gap: 36px; }
  .gift-line {
    font-family: "Sniglet", "Fredoka", system-ui, sans-serif;
    font-size: clamp(1.7rem, 7.5vw, 2.3rem);
    color: var(--rose-deep);
    text-align: center;
    margin: 0;
    transition: opacity .4s;
  }
  .tap-hint { font-size: .95rem; color: var(--plum-soft); margin: 0; transition: opacity .3s; }

  .box { position: relative; width: 190px; height: 190px; animation: wiggle 2.4s ease-in-out infinite; }
  .box-body {
    position: absolute; left: 10px; right: 10px; bottom: 0; height: 130px;
    background: var(--rose);
    border-radius: 10px 10px 16px 16px;
    box-shadow: inset 0 -10px 0 rgba(0,0,0,.08);
  }
  .box-body::before {             /* vertical ribbon */
    content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 30px;
    transform: translateX(-50%); background: var(--ribbon);
  }
  .lid {
    position: absolute; left: 0; right: 0; top: 30px; height: 44px;
    background: var(--rose-deep);
    border-radius: 10px;
    transform-origin: 15% 100%;
    transition: transform .7s cubic-bezier(.3,1.5,.5,1), opacity .5s .5s;
    z-index: 2;
  }
  .lid::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 30px;
    transform: translateX(-50%); background: var(--ribbon);
  }
  .bow { position: absolute; left: 50%; bottom: 100%; width: 0; height: 0; }
  .bow i {
    position: absolute; bottom: -6px; width: 46px; height: 34px;
    border: 9px solid var(--ribbon); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: transparent;
  }
  .bow i:first-child { right: -2px; transform: rotate(-22deg); }
  .bow i:last-child  { left: -2px;  transform: rotate(22deg); }
  .bow b { position: absolute; left: -9px; bottom: -8px; width: 18px; height: 16px; border-radius: 6px; background: var(--ribbon); }

  .box.open { animation: none; }
  .box.open .lid { transform: translate(-50px, -110px) rotate(-38deg); opacity: 0; }
  .box.gone { transition: transform .45s ease-in, opacity .45s ease-in; transform: scale(.2); opacity: 0; }
  @keyframes wiggle {
    0%, 70%, 100% { transform: rotate(0); }
    75% { transform: rotate(-5deg); } 80% { transform: rotate(5deg); }
    85% { transform: rotate(-3deg); } 90% { transform: rotate(3deg); }
  }

  /* kissing kitten */
  .kiss {
    position: fixed; left: 50%; top: 50%;
    width: min(66vw, 300px);
    transform: translate(-50%, 110vh);
    transition: transform 1.3s cubic-bezier(.2,.9,.3,1.08);
    z-index: 3;
    pointer-events: none;
  }
  .kiss.up { transform: translate(-50%, -50%); }
  .kiss img { display: block; width: 100%; border-radius: 26px; box-shadow: 0 16px 40px rgba(194,69,111,.3); }

  /* dancing cats in the corners */
  .dancer {
    position: fixed; width: min(24vw, 130px); z-index: 2; pointer-events: none;
    opacity: 0; transform: scale(.4); transition: opacity .5s, transform .6s cubic-bezier(.3,1.6,.5,1);
  }
  .dancer img { display: block; width: 100%; border-radius: 18px; }
  .dancer.show { opacity: 1; transform: scale(1); }
  .dancer.tl { top: calc(env(safe-area-inset-top, 0px) + 12px); left: 12px; }
  .dancer.tr { top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; }
  .dancer.bl { bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); left: 12px; }
  .dancer.br { bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); right: 12px; }
  /* the dancing kitten has a white background: multiply lets the pink show through */
  .dancer { mix-blend-mode: multiply; }
  .dancer img { transform-origin: 50% 90%; animation: bop .45s ease-in-out infinite alternate; }
  .dancer.tr img, .dancer.br img { animation-name: bopFlip; animation-delay: .22s; }
  @keyframes bop     { from { transform: rotate(-10deg) translateY(0); }  to { transform: rotate(10deg) translateY(-6px); } }
  @keyframes bopFlip { from { transform: scaleX(-1) rotate(-10deg) translateY(0); } to { transform: scaleX(-1) rotate(10deg) translateY(-6px); } }
  /* the kissing cat leans in for a smooch, over and over */
  .kiss.up img { animation: leanIn 1.4s ease-in-out .9s infinite; }
  @keyframes leanIn { 0%, 55%, 100% { transform: scale(1); } 30% { transform: scale(1.1) rotate(-2deg); } }

  /* stand-ins until the real GIFs are uploaded */
  .standin { display: grid; place-items: center; aspect-ratio: 1; line-height: 1; }
  .kiss .standin { font-size: min(40vw, 180px); animation: smooch 1s ease-in-out infinite; }
  .dancer .standin { font-size: min(14vw, 70px); animation: boogie .6s ease-in-out infinite alternate; }
  @keyframes smooch { 50% { transform: scale(1.1) rotate(-4deg); } }
  @keyframes boogie { from { transform: rotate(-14deg) translateY(0); } to { transform: rotate(14deg) translateY(-8px); } }

  /* hearts */
  .heart {
    position: fixed; z-index: 1; pointer-events: none; line-height: 1;
    animation: heartPop var(--dur, 3.2s) ease-out forwards;
  }
  @keyframes heartPop {
    0%   { opacity: 0; transform: translateY(20px) scale(.3) rotate(var(--rot, 0deg)); }
    20%  { opacity: 1; transform: translateY(0) scale(1.1) rotate(var(--rot, 0deg)); }
    30%  { transform: translateY(0) scale(1) rotate(var(--rot, 0deg)); }
    100% { opacity: 0; transform: translateY(-70px) scale(.9) rotate(var(--rot, 0deg)); }
  }

  .again {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); z-index: 4;
    transform: translateX(-50%);
    font: 500 1rem "Fredoka", system-ui, sans-serif;
    color: var(--rose-deep); background: var(--white);
    border: 2px solid var(--petal); border-radius: 999px;
    padding: 10px 20px; cursor: pointer;
    opacity: 0; transition: opacity .6s;
  }
  .again.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .box, .choice, .kiss .standin, .dancer .standin, .kiss.up img, .dancer img { animation: none; }
    .kiss, .lid, .dancer { transition-duration: .01s; }
  }

  /* iPad / Mac: a little more room */
  @media (min-width: 700px) {
    .box { transform: scale(1.3); }
    .box.gone { transform: scale(.25); }
    .greet { max-width: 460px; }
  }
</style>

</head>
<body>
<section class="screen" id="hello">
  <div class="greet">
    <h1>Hello Praebooboo!,<span>how are you feeling todayy</span></h1>
    <div class="choices" role="group" aria-label="How are you feeling?">
      <button class="choice" id="c1" type="button">feeling happyyyyyyyy 😆</button>
      <button class="choice" id="c2" type="button">Missing youuuu 🥺</button>
      <button class="choice" id="c3" type="button">want to cuddle 😳</button>
      <button class="choice" id="c4" type="button">Sad day 😢</button>
    </div>
  </div>
</section>

<section class="screen away" id="gift" aria-label="Your gift. Tap to open.">
  <p class="gift-line" id="giftLine">here, a gift you na</p>
  <div class="box" id="box" aria-hidden="true">
    <div class="lid"><div class="bow"><i></i><i></i><b></b></div></div>
    <div class="box-body"></div>
  </div>
  <p class="tap-hint" id="hint">tap to open 🩷</p>
</section>

<div class="kiss" id="kiss"><img src="kiss.jpg" alt="Kissing kitten"></div>
<div class="dancer tl"><img src="dance.jpg" alt=""></div>
<div class="dancer tr"><img src="dance.jpg" alt=""></div>
<div class="dancer bl"><img src="dance.jpg" alt=""></div>
<div class="dancer br"><img src="dance.jpg" alt=""></div>

<button class="again" id="again" type="button" hidden>again 🩷</button>

<script>
  const $ = (s) => document.querySelector(s);
  const hello = $("#hello"), gift = $("#gift"), box = $("#box");
  const kiss = $("#kiss"), again = $("#again");
  const dancers = document.querySelectorAll(".dancer");
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // Until the GIFs are uploaded, show a cute emoji stand-in instead of a broken image.
  document.querySelectorAll(".kiss img, .dancer img").forEach((img) => {
    const swap = () => {
      const s = document.createElement("div");
      s.className = "standin";
      s.textContent = img.closest(".kiss") ? "😽" : "🐈";
      img.replaceWith(s);
    };
    if (img.complete && img.naturalWidth === 0) swap(); else img.addEventListener("error", swap);
  });

  // Page 1 → page 2 (every answer leads to the gift)
  document.querySelectorAll(".choice").forEach((btn) => {
    btn.addEventListener("click", async () => {
      btn.classList.add("picked");
      await wait(250);
      hello.classList.add("away");
      gift.classList.remove("away");
    });
  });

  // Page 2: tap anywhere → lid opens → box disappears → kitten rises → hearts + dancing cats
  let stage = "closed";
  gift.addEventListener("click", async () => {
    if (stage !== "closed") return;
    stage = "opening";
    $("#hint").style.opacity = 0;

    box.classList.add("open");                 // 1. open the lid
    await wait(900);

    $("#giftLine").style.opacity = 0;
    box.classList.add("gone");                 // 2. the box disappears
    await wait(450);

    kiss.classList.add("up");                  // 3. kitten rises to the middle
    await wait(700);
    dancers.forEach((d, i) => setTimeout(() => d.classList.add("show"), i * 150));
    startHearts();

    await wait(2500);
    again.hidden = false;
    requestAnimationFrame(() => again.classList.add("show"));
    stage = "done";
  });

  // Hearts pop up all over the screen, leaving the middle clear for the kitten.
  let heartTimer = null;
  function heart() {
    const h = document.createElement("span");
    h.className = "heart";
    h.textContent = "🩷";
    let x, y;
    do { x = Math.random() * 92 + 2; y = Math.random() * 88 + 4; }
    while ((x > 26 && x < 74 && y > 28 && y < 72) ||   // keep the centre clear
           ((x < 30 || x > 70) && (y < 18 || y > 82)));  // and the dancing corners
    h.style.left = x + "vw";
    h.style.top = y + "vh";
    h.style.fontSize = (18 + Math.random() * 26) + "px";
    h.style.setProperty("--rot", (Math.random() * 40 - 20) + "deg");
    h.style.setProperty("--dur", (2.6 + Math.random() * 1.6) + "s");
    document.body.appendChild(h);
    h.addEventListener("animationend", () => h.remove());
  }
  function startHearts() {
    for (let i = 0; i < 18; i++) setTimeout(heart, i * 60);
    heartTimer = setInterval(heart, 220);
  }

  // Start over
  again.addEventListener("click", async (e) => {
    e.stopPropagation();
    clearInterval(heartTimer);
    again.classList.remove("show");
    kiss.classList.remove("up");
    dancers.forEach((d) => d.classList.remove("show"));
    gift.classList.add("away");
    await wait(500);
    again.hidden = true;
    box.classList.remove("open", "gone");
    $("#giftLine").style.opacity = 1;
    $("#hint").style.opacity = 1;
    document.querySelectorAll(".choice").forEach((b) => b.classList.remove("picked"));
    hello.classList.remove("away");
    stage = "closed";
  });
</script>
</body>
</html>
